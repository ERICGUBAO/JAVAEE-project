<!doctype html>
<html lang="zh-CN"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<nav class="navbar navbar-expand-lg" th:fragment="navbar">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">
            <span class="brand-dot"></span>
            考勤管理系统
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/}">🏠 首页</a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('STUDENT')">
                    <a class="nav-link" th:href="@{/attendance/checkIn}">📋 签到打卡</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/attendance/list}">📊 考勤记录</a>
                </li>
                <li class="nav-item" sec:authorize="hasAnyRole('TEACHER','ADMIN')">
                    <a class="nav-link" th:href="@{/student/list}">👥 学生管理</a>
                </li>
                <li class="nav-item" sec:authorize="hasAnyRole('TEACHER','ADMIN')">
                    <a class="nav-link" th:href="@{/attendance/import}">📥 批量导入</a>
                </li>
            </ul>

            <div class="d-flex align-items-center gap-3">
                <span class="text-white-50" style="font-size:.85rem;">
                    👤 <span sec:authentication="name">用户</span>
                </span>
                <form th:action="@{/logout}" method="post" class="m-0">
                    <button class="btn btn-outline-light btn-sm" type="submit">退出</button>
                </form>
            </div>
        </div>
    </div>
</nav>
</body>
</html>
