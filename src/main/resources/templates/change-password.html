<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>修改密码</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.0/css/bootstrap.min.css}" />
    <link rel="stylesheet" th:href="@{/css/app.css}" />
</head>
<body class="auth-page">
<div class="auth-card">
    <h3 class="text-center mb-4">🔒 修改密码</h3>

    <div class="alert alert-success" th:if="${success}" th:text="${success}"></div>
    <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

    <form method="post" th:action="@{/change-password}">
        <div class="mb-3">
            <label class="form-label">原密码</label>
            <input type="password" class="form-control" name="oldPassword" required autofocus />
        </div>
        <div class="mb-3">
            <label class="form-label">新密码</label>
            <input type="password" class="form-control" name="newPassword" required />
        </div>
        <div class="mb-4">
            <label class="form-label">确认新密码</label>
            <input type="password" class="form-control" name="confirmPassword" required />
        </div>
        <button type="submit" class="btn-auth">确认修改</button>
    </form>

    <p class="auth-footer"><a th:href="@{/}">← 返回首页</a></p>
</div>
</body>
</html>
