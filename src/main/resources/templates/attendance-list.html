<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>考勤记录 — 考勤管理系统</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.0/css/bootstrap.min.css}" />
    <link rel="stylesheet" th:href="@{/css/app.css}" />
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="main-content">
    <div class="container">

        <div class="page-header">
            <h2>📊 考勤记录</h2>
        </div>

        <!-- 快捷日期 -->
        <div class="quick-dates" id="quickDates">
            <button class="qd-btn" data-days="0">今天</button>
            <button class="qd-btn" data-days="1">昨天</button>
            <button class="qd-btn" data-days="7">近7天</button>
            <button class="qd-btn" data-days="30">近30天</button>
            <button class="qd-btn" data-days="">全部</button>
        </div>

        <!-- 筛选栏 -->
        <div class="search-bar mb-4">
            <form class="row g-2 align-items-end" th:action="@{/attendance/list}" method="get" id="filterForm">
                <div class="col-6 col-md-2">
                    <label class="form-label text-muted" style="font-size:.75rem;font-weight:600;">开始</label>
                    <input type="date" class="form-control form-control-sm" name="startDate" th:value="${startDate}" id="startDate" />
                </div>
                <div class="col-6 col-md-2">
                    <label class="form-label text-muted" style="font-size:.75rem;font-weight:600;">结束</label>
                    <input type="date" class="form-control form-control-sm" name="endDate" th:value="${endDate}" id="endDate" />
                </div>
                <div class="col-6 col-md-2">
                    <label class="form-label text-muted" style="font-size:.75rem;font-weight:600;">状态</label>
                    <select class="form-select form-select-sm" name="status">
                        <option value="">全部</option>
                        <option value="NORMAL" th:selected="${status=='NORMAL'}">✅ 正常</option>
                        <option value="LATE"   th:selected="${status=='LATE'}">⏰ 迟到</option>
                        <option value="EARLY"  th:selected="${status=='EARLY'}">🚪 早退</option>
                    </select>
                </div>
                <div class="col-6 col-md-3">
                    <label class="form-label text-muted" style="font-size:.75rem;font-weight:600;">课程</label>
                    <select class="form-select form-select-sm" name="courseId">
                        <option value="">全部课程</option>
                        <option th:each="c : ${courses}" th:value="${c.courseId}"
                                th:selected="${courseId == c.courseId}"
                                th:text="${c.courseId}+' '+${c.courseName}+' '+${c.startTime}+'-'+${c.endTime}"></option>
                    </select>
                </div>
                <div class="col-4 col-md-1">
                    <button class="btn btn-primary btn-sm w-100" type="submit">查询</button>
                </div>
                <div class="col-4 col-md-1">
                    <a class="btn btn-outline-secondary btn-sm w-100" th:href="@{/attendance/list}">重置</a>
                </div>
            </form>
        </div>

        <!-- 统计卡片 -->
        <div class="stat-row">
            <div class="stat-card">
                <div class="num" style="color:#4f46e5;" id="statTotal" th:text="${totalElements != null ? totalElements : 0}">0</div>
                <div class="lbl">总记录</div>
            </div>
            <div class="stat-card">
                <div class="num" style="color:#16a34a;" id="statNormal">-</div>
                <div class="lbl">正常</div>
            </div>
            <div class="stat-card">
                <div class="num" style="color:#dc2626;" id="statLate">-</div>
                <div class="lbl">迟到</div>
            </div>
            <div class="stat-card">
                <div class="num" style="color:#d97706;" id="statEarly">-</div>
                <div class="lbl">早退</div>
            </div>
        </div>

        <!-- ====== 桌面端：表格 ====== -->
        <div class="data-table att-table">
            <table class="table table-hover mb-0">
                <thead><tr>
                    <th th:if="${isTeacherOrAdmin}">学号</th>
                    <th th:if="${isTeacherOrAdmin}">姓名</th>
                    <th>日期</th><th>课程</th>
                    <th>签到</th><th>签退</th><th>状态</th>
                </tr></thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(records)}">
                    <td th:colspan="${isTeacherOrAdmin} ? 7 : 5" class="text-center text-muted py-4">暂无考勤记录</td>
                </tr>
                <tr th:each="r : ${records}">
                    <td th:if="${isTeacherOrAdmin}" th:text="${r.studentId}"></td>
                    <td th:if="${isTeacherOrAdmin}" th:text="${r.studentName}"></td>
                    <td th:text="${#temporals.format(r.checkInTime, 'yyyy-MM-dd')}"></td>
                    <td th:text="${r.courseId}"></td>
                    <td th:text="${#temporals.format(r.checkInTime, 'HH:mm:ss')}"></td>
                    <td>
                        <span th:if="${r.checkOutTime != null}" th:text="${#temporals.format(r.checkOutTime, 'HH:mm:ss')}"></span>
                        <span th:if="${r.checkOutTime == null}" class="text-muted">—</span>
                    </td>
                    <td>
                        <span class="status-badge"
                              th:classappend="${r.status=='NORMAL'}?'normal':(${r.status=='LATE'}?'late':(${r.status=='EARLY'}?'early':'absent'))"
                              th:text="${r.status=='NORMAL'}?'正常':(${r.status=='LATE'}?'迟到':(${r.status=='EARLY'}?'早退':${r.status}))"></span>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <!-- ====== 移动端：卡片 ====== -->
        <div class="att-cards">
            <p th:if="${#lists.isEmpty(records)}" class="text-center text-muted py-5">暂无考勤记录</p>
            <div class="att-card" th:each="r : ${records}">
                <div class="top-row">
                    <div class="student-info">
                        <div class="student-avatar" th:text="${r.studentName != null ? #strings.substring(r.studentName, #strings.length(r.studentName)-2, #strings.length(r.studentName)) : '?'}"></div>
                        <div>
                            <div style="font-weight:600;" th:text="${r.studentName}"></div>
                            <div style="font-size:.75rem;color:var(--muted);" th:text="${r.studentId}"></div>
                        </div>
                    </div>
                    <span class="status-badge"
                          th:classappend="${r.status=='NORMAL'}?'normal':(${r.status=='LATE'}?'late':(${r.status=='EARLY'}?'early':'absent'))"
                          th:text="${r.status=='NORMAL'}?'正常':(${r.status=='LATE'}?'迟到':(${r.status=='EARLY'}?'早退':${r.status}))"></span>
                </div>
                <div class="meta" th:text="${r.courseId} + ' · ' + ${#temporals.format(r.checkInTime, 'yyyy-MM-dd')}"></div>
                <div class="time-row">
                    <span>签到: <strong th:text="${#temporals.format(r.checkInTime, 'HH:mm:ss')}"></strong></span>
                    <span th:if="${r.checkOutTime != null}">签退: <strong th:text="${#temporals.format(r.checkOutTime, 'HH:mm:ss')}"></strong></span>
                    <span th:if="${r.checkOutTime == null}" class="text-muted">未签退</span>
                </div>
            </div>
        </div>

        <!-- 分页 -->
        <nav th:if="${totalPages != null and totalPages > 1}">
            <ul class="pagination justify-content-center mt-3">
                <li class="page-item" th:classappend="${currentPage == 1} ? 'disabled'">
                    <a class="page-link" th:href="@{/attendance/list(page=${currentPage-1},startDate=${startDate},endDate=${endDate},status=${status},courseId=${courseId})}">‹</a>
                </li>
                <li class="page-item" th:each="i : ${#numbers.sequence(1, totalPages)}" th:classappend="${i == currentPage} ? 'active'">
                    <a class="page-link" th:href="@{/attendance/list(page=${i},startDate=${startDate},endDate=${endDate},status=${status},courseId=${courseId})}" th:text="${i}">1</a>
                </li>
                <li class="page-item" th:classappend="${currentPage == totalPages} ? 'disabled'">
                    <a class="page-link" th:href="@{/attendance/list(page=${currentPage+1},startDate=${startDate},endDate=${endDate},status=${status},courseId=${courseId})}">›</a>
                </li>
            </ul>
        </nav>

    </div>
</div>

<script th:src="@{/webjars/bootstrap/5.3.0/js/bootstrap.bundle.min.js}"></script>
<script>
    // 统计当前页状态
    (function(){
        var rows = document.querySelectorAll('.att-table tbody tr');
        var n=0,l=0,e=0;
        rows.forEach(function(r){
            var badge = r.querySelector('.status-badge');
            if(!badge) return;
            if(badge.classList.contains('normal')) n++;
            else if(badge.classList.contains('late')) l++;
            else if(badge.classList.contains('early')) e++;
        });
        document.getElementById('statNormal').textContent = n;
        document.getElementById('statLate').textContent = l;
        document.getElementById('statEarly').textContent = e;
    })();

    // 快捷日期
    document.querySelectorAll('.qd-btn').forEach(function(btn){
        btn.onclick = function(){
            document.querySelectorAll('.qd-btn').forEach(function(b){b.classList.remove('active')});
            this.classList.add('active');
            var days = parseInt(this.dataset.days);
            if(isNaN(days)){ document.getElementById('startDate').value='';document.getElementById('endDate').value=''; }
            else {
                var end = new Date();
                var start = new Date();
                start.setDate(start.getDate() - days);
                document.getElementById('endDate').value = end.toISOString().split('T')[0];
                document.getElementById('startDate').value = start.toISOString().split('T')[0];
            }
            document.getElementById('filterForm').submit();
        };
        // 高亮当前匹配的按钮
        var s = document.getElementById('startDate').value;
        var e = document.getElementById('endDate').value;
        if(s && e){
            var diff = Math.round((new Date(e) - new Date(s)) / 86400000);
            if(diff === parseInt(btn.dataset.days)) btn.classList.add('active');
        }
        if(!s && !e && btn.dataset.days === '') btn.classList.add('active');
    });
</script>
</body>
</html>
