<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>考勤记录 — 考勤管理系统</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.0/css/bootstrap.min.css}" />
    <link rel="stylesheet" th:href="@{/css/app.css}" />
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="main-content">
    <div class="container">

        <div class="page-header">
            <h2>📊 考勤记录</h2>
        </div>

        <!-- 筛选栏 -->
        <div class="search-bar mb-4">
            <form class="row g-2 align-items-end" th:action="@{/attendance/list}" method="get">
                <div class="col-md-2">
                    <label class="form-label text-muted" style="font-size:.8rem; font-weight:600;">开始日期</label>
                    <input type="date" class="form-control form-control-sm" name="startDate" th:value="${startDate}" />
                </div>
                <div class="col-md-2">
                    <label class="form-label text-muted" style="font-size:.8rem; font-weight:600;">结束日期</label>
                    <input type="date" class="form-control form-control-sm" name="endDate" th:value="${endDate}" />
                </div>
                <div class="col-md-2">
                    <label class="form-label text-muted" style="font-size:.8rem; font-weight:600;">状态</label>
                    <select class="form-select form-select-sm" name="status">
                        <option value="">全部状态</option>
                        <option value="NORMAL" th:selected="${status=='NORMAL'}">✅ 正常</option>
                        <option value="LATE"   th:selected="${status=='LATE'}">⏰ 迟到</option>
                        <option value="EARLY"  th:selected="${status=='EARLY'}">🚪 早退</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label text-muted" style="font-size:.8rem; font-weight:600;">课程</label>
                    <select class="form-select form-select-sm" name="courseId">
                        <option value="">全部课程</option>
                        <option th:each="c : ${courses}"
                                th:value="${c.courseId}"
                                th:selected="${courseId == c.courseId}"
                                th:text="${c.courseId + ' · ' + c.courseName}">
                        </option>
                    </select>
                </div>
                <div class="col-md-1">
                    <button class="btn btn-primary btn-sm w-100" type="submit">查询</button>
                </div>
                <div class="col-md-1">
                    <a class="btn btn-outline-secondary btn-sm w-100" th:href="@{/attendance/list}">重置</a>
                </div>
            </form>
        </div>

        <!-- 表格 -->
        <div class="data-table">
            <table class="table table-hover mb-0">
                <thead>
                <tr>
                    <th th:if="${isTeacherOrAdmin}">学号</th>
                    <th th:if="${isTeacherOrAdmin}">姓名</th>
                    <th>日期</th>
                    <th>课程</th>
                    <th>签到时间</th>
                    <th>签退时间</th>
                    <th>状态</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(records)}">
                    <td th:colspan="${isTeacherOrAdmin} ? 7 : 5" class="text-center text-muted py-5">
                        暂无考勤记录
                    </td>
                </tr>
                <tr th:each="r : ${records}">
                    <td th:if="${isTeacherOrAdmin}" th:text="${r.studentId}"></td>
                    <td th:if="${isTeacherOrAdmin}" th:text="${r.studentName}"></td>
                    <td th:text="${#temporals.format(r.checkInTime, 'yyyy-MM-dd')}"></td>
                    <td th:text="${r.courseId}"></td>
                    <td th:text="${#temporals.format(r.checkInTime, 'HH:mm:ss')}"></td>
                    <td>
                        <span th:if="${r.checkOutTime != null}"
                              th:text="${#temporals.format(r.checkOutTime, 'HH:mm:ss')}"></span>
                        <span th:if="${r.checkOutTime == null}" class="text-muted">—</span>
                    </td>
                    <td>
                        <span class="status-badge"
                              th:classappend="${r.status=='NORMAL'} ? 'normal' : (${r.status=='LATE'} ? 'late' : (${r.status=='EARLY'} ? 'early' : 'absent'))"
                              th:text="${r.status=='NORMAL'} ? '正常' : (${r.status=='LATE'} ? '迟到' : (${r.status=='EARLY'} ? '早退' : ${r.status}))">
                        </span>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <!-- 分页 -->
        <nav class="mt-3" th:if="${totalPages != null and totalPages > 1}">
            <ul class="pagination justify-content-center">
                <li class="page-item" th:classappend="${currentPage == 1} ? 'disabled'">
                    <a class="page-link"
                       th:href="@{/attendance/list(page=${currentPage-1},size=10,startDate=${startDate},endDate=${endDate},status=${status},courseId=${courseId})}">
                        ‹ 上一页
                    </a>
                </li>
                <li class="page-item"
                    th:each="i : ${#numbers.sequence(1, totalPages)}"
                    th:classappend="${i == currentPage} ? 'active'">
                    <a class="page-link"
                       th:href="@{/attendance/list(page=${i},size=10,startDate=${startDate},endDate=${endDate},status=${status},courseId=${courseId})}"
                       th:text="${i}">1</a>
                </li>
                <li class="page-item" th:classappend="${currentPage == totalPages} ? 'disabled'">
                    <a class="page-link"
                       th:href="@{/attendance/list(page=${currentPage+1},size=10,startDate=${startDate},endDate=${endDate},status=${status},courseId=${courseId})}">
                        下一页 ›
                    </a>
                </li>
            </ul>
        </nav>

    </div>
</div>

<script th:src="@{/webjars/bootstrap/5.3.0/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
