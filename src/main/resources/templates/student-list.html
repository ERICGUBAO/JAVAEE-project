<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>学生管理 — 考勤管理系统</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.0/css/bootstrap.min.css}" />
    <link rel="stylesheet" th:href="@{/css/app.css}" />
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="main-content">
    <div class="container">

        <div class="page-header">
            <h2>👥 学生管理</h2>
            <a class="btn btn-primary btn-sm" th:href="@{/student/add}">+ 新增学生</a>
        </div>

        <!-- 搜索栏 -->
        <div class="search-bar mb-4">
            <form class="row g-2 align-items-end" th:action="@{/student/list}" method="get">
                <div class="col-md-2">
                    <label class="form-label text-muted" style="font-size:.8rem; font-weight:600;">学号</label>
                    <input class="form-control form-control-sm" name="studentId"
                           placeholder="搜索学号…" th:value="${studentId}" />
                </div>
                <div class="col-md-2">
                    <label class="form-label text-muted" style="font-size:.8rem; font-weight:600;">姓名</label>
                    <input class="form-control form-control-sm" name="studentName"
                           placeholder="搜索姓名…" th:value="${studentName}" />
                </div>
                <div class="col-md-2">
                    <label class="form-label text-muted" style="font-size:.8rem; font-weight:600;">课程</label>
                    <select class="form-select form-select-sm" name="courseId">
                        <option value="">全部课程</option>
                        <option th:each="c : ${availableCourses}"
                                th:value="${c.courseId}"
                                th:selected="${courseId == c.courseId}"
                                th:text="${c.courseId} + ' ' + ${c.courseName} + ' ' + ${c.startTime} + '-' + ${c.endTime}">
                        </option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label text-muted" style="font-size:.8rem; font-weight:600;">学院</label>
                    <select class="form-select form-select-sm" name="department">
                        <option value="">全部学院</option>
                        <option th:each="d : ${departments}"
                                th:value="${d}" th:selected="${department == d}" th:text="${d}">
                        </option>
                    </select>
                </div>
                <input type="hidden" name="sortField" th:value="${sortField}" />
                <input type="hidden" name="sortDir"   th:value="${sortDir}" />
                <input type="hidden" name="size"      th:value="${pageSize}" />
                <div class="col-md-1">
                    <button class="btn btn-primary btn-sm w-100" type="submit">搜索</button>
                </div>
                <div class="col-md-1">
                    <a class="btn btn-outline-secondary btn-sm w-100" th:href="@{/student/list}">重置</a>
                </div>
            </form>
        </div>

        <!-- 批量删除 + 表格 -->
        <form th:action="@{/student/batchDelete}" method="post">
            <div class="d-flex justify-content-between align-items-center mb-2">
                <span class="text-muted" style="font-size:.8125rem;">
                    共 <strong th:text="${totalElements}">0</strong> 条记录
                </span>
                <button class="btn btn-danger btn-sm" type="submit"
                        onclick="return confirm('确定要批量删除选中的记录吗？')">
                    🗑 批量删除
                </button>
            </div>

            <div class="data-table">
                <table class="table table-hover mb-0">
                    <thead>
                    <tr>
                        <th style="width:40px;">
                            <input type="checkbox" class="form-check-input"
                                   onclick="document.querySelectorAll('input[name=ids]').forEach(cb=>cb.checked=this.checked)" />
                        </th>
                        <th>
                            <a th:href="@{/student/list(page=1,size=${pageSize},studentId=${studentId},studentName=${studentName},sortField='studentId',sortDir=${sortField=='studentId' and sortDir=='asc' ? 'desc' : 'asc'})}">
                                学号
                                <span th:if="${sortField=='studentId'}" th:text="${sortDir=='asc'} ? '↑' : '↓'"></span>
                            </a>
                        </th>
                        <th>
                            <a th:href="@{/student/list(page=1,size=${pageSize},studentId=${studentId},studentName=${studentName},sortField='studentName',sortDir=${sortField=='studentName' and sortDir=='asc' ? 'desc' : 'asc'})}">
                                姓名
                                <span th:if="${sortField=='studentName'}" th:text="${sortDir=='asc'} ? '↑' : '↓'"></span>
                            </a>
                        </th>
                        <th>学院</th>
                        <th>性别</th>
                        <th>
                            <a th:href="@{/student/list(page=1,size=${pageSize},studentId=${studentId},studentName=${studentName},sortField='courseId',sortDir=${sortField=='courseId' and sortDir=='asc' ? 'desc' : 'asc'})}">
                                课程
                                <span th:if="${sortField=='courseId'}" th:text="${sortDir=='asc'} ? '↑' : '↓'"></span>
                            </a>
                        </th>
                        <th>出生日期</th>
                        <th>联系方式</th>
                        <th>
                            <a th:href="@{/student/list(page=1,size=${pageSize},studentId=${studentId},studentName=${studentName},sortField='selectTime',sortDir=${sortField=='selectTime' and sortDir=='asc' ? 'desc' : 'asc'})}">
                                选课时间
                                <span th:if="${sortField=='selectTime'}" th:text="${sortDir=='asc'} ? '↑' : '↓'"></span>
                            </a>
                        </th>
                        <th style="width:130px;">操作</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${#lists.isEmpty(students)}">
                        <td colspan="10" class="text-center text-muted py-5">暂无学生数据</td>
                    </tr>
                    <tr th:each="s : ${students}">
                        <td><input type="checkbox" class="form-check-input" name="ids" th:value="${s.id}" /></td>
                        <td th:text="${s.studentId}"></td>
                        <td th:text="${s.studentName}"></td>
                        <td th:text="${s.department != null ? s.department : '—'}"></td>
                        <td>
                            <span th:if="${s.gender == 'M'}" style="color:#3b82f6;">♂ 男</span>
                            <span th:if="${s.gender == 'F'}" style="color:#ec4899;">♀ 女</span>
                            <span th:if="${s.gender == null or s.gender == ''}" class="text-muted">—</span>
                        </td>
                        <td th:text="${s.courseId}"></td>
                        <td th:text="${s.birthDate != null ? #temporals.format(s.birthDate, 'yyyy-MM-dd') : '—'}"></td>
                        <td th:text="${s.phone != null and s.phone != '' ? s.phone : '—'}"></td>
                        <td th:text="${s.selectTime != null ? #temporals.format(s.selectTime, 'yyyy-MM-dd HH:mm') : '—'}"></td>
                        <td>
                            <a class="btn btn-sm btn-outline-primary me-1"
                               th:href="@{/student/edit/{id}(id=${s.id})}">编辑</a>
                            <a class="btn btn-sm btn-outline-danger"
                               th:href="@{/student/delete/{id}(id=${s.id})}"
                               onclick="return confirm('确定要删除该记录吗？')">删除</a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </form>

        <!-- 分页 -->
        <nav class="mt-3" th:if="${totalPages != null and totalPages > 1}">
            <ul class="pagination justify-content-center">
                <li class="page-item" th:classappend="${currentPage == 1} ? 'disabled'">
                    <a class="page-link"
                       th:href="@{/student/list(page=${currentPage-1},size=${pageSize},studentId=${studentId},studentName=${studentName},sortField=${sortField},sortDir=${sortDir})}">
                        ‹ 上一页
                    </a>
                </li>
                <li class="page-item"
                    th:each="i : ${#numbers.sequence(1, totalPages)}"
                    th:classappend="${i == currentPage} ? 'active'">
                    <a class="page-link"
                       th:href="@{/student/list(page=${i},size=${pageSize},studentId=${studentId},studentName=${studentName},sortField=${sortField},sortDir=${sortDir})}"
                       th:text="${i}">1</a>
                </li>
                <li class="page-item" th:classappend="${currentPage == totalPages} ? 'disabled'">
                    <a class="page-link"
                       th:href="@{/student/list(page=${currentPage+1},size=${pageSize},studentId=${studentId},studentName=${studentName},sortField=${sortField},sortDir=${sortDir})}">
                        下一页 ›
                    </a>
                </li>
            </ul>
        </nav>

    </div>
</div>

<script th:src="@{/webjars/bootstrap/5.3.0/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
