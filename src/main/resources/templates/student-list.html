<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>学生列表</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.0/css/bootstrap.min.css}" />
</head>
<body>
<div class="container mt-4">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="mb-0">学生列表</h2>
        <div>
            <a class="btn btn-success" th:href="@{/student/add}">新增学生</a>
            <a class="btn btn-secondary" th:href="@{/}">返回首页</a>
        </div>
    </div>

    <!-- 搜索（GET） -->
    <form class="row g-2 mb-3" th:action="@{/student/list}" method="get">
        <div class="col-md-3">
            <input class="form-control" name="studentId" placeholder="按学号搜索"
                   th:value="${studentId}" />
        </div>
        <div class="col-md-3">
            <input class="form-control" name="studentName" placeholder="按姓名搜索"
                   th:value="${studentName}" />
        </div>

        <input type="hidden" name="sortField" th:value="${sortField}" />
        <input type="hidden" name="sortDir" th:value="${sortDir}" />
        <input type="hidden" name="size" th:value="${pageSize}" />

        <div class="col-md-2">
            <button class="btn btn-primary w-100" type="submit">搜索</button>
        </div>
        <div class="col-md-2">
            <a class="btn btn-outline-secondary w-100" th:href="@{/student/list}">重置</a>
        </div>
    </form>

    <!-- 批量删除（POST） -->
    <form th:action="@{/student/batchDelete}" method="post">
        <div class="mb-2">
            <button class="btn btn-danger"
                    type="submit"
                    onclick="return confirm('确定要批量删除选中的记录吗？')">
                批量删除
            </button>
        </div>

        <table class="table table-striped table-hover">
            <thead class="table-dark">
            <tr>
                <th style="width:40px;">
                    <!-- 简易全选 -->
                    <input type="checkbox"
                           onclick="document.querySelectorAll('input[name=ids]').forEach(cb=>cb.checked=this.checked)" />
                </th>

                <th>
                    <a class="text-white text-decoration-none"
                       th:href="@{/student/list(page=1,size=${pageSize},studentId=${studentId},studentName=${studentName},
                     sortField='studentId',sortDir=${sortField=='studentId' and sortDir=='asc' ? 'desc' : 'asc'})}">
                        学号
                    </a>
                </th>

                <th>
                    <a class="text-white text-decoration-none"
                       th:href="@{/student/list(page=1,size=${pageSize},studentId=${studentId},studentName=${studentName},
                     sortField='studentName',sortDir=${sortField=='studentName' and sortDir=='asc' ? 'desc' : 'asc'})}">
                        姓名
                    </a>
                </th>

                <th>性别</th>

                <th>
                    <a class="text-white text-decoration-none"
                       th:href="@{/student/list(page=1,size=${pageSize},studentId=${studentId},studentName=${studentName},
                     sortField='courseId',sortDir=${sortField=='courseId' and sortDir=='asc' ? 'desc' : 'asc'})}">
                        课程
                    </a>
                </th>

                <th>出生日期</th>
                <th>联系方式</th>

                <th>
                    <a class="text-white text-decoration-none"
                       th:href="@{/student/list(page=1,size=${pageSize},studentId=${studentId},studentName=${studentName},
                     sortField='selectTime',sortDir=${sortField=='selectTime' and sortDir=='asc' ? 'desc' : 'asc'})}">
                        选课时间
                    </a>
                </th>

                <th style="width: 170px;">操作</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="s : ${students}">
                <td><input type="checkbox" name="ids" th:value="${s.id}" /></td>
                <td th:text="${s.studentId}">2023001</td>
                <td th:text="${s.studentName}">张三</td>
                <td th:text="${s.gender}">M</td>
                <td th:text="${s.courseId}">C001</td>

                <!-- birthDate 格式化成 yyyy-MM-dd -->
                <td th:text="${s.birthDate != null ? #temporals.format(s.birthDate, 'yyyy-MM-dd') : ''}">2000-01-01</td>

                <td th:text="${s.phone}">13800138000</td>

                <!-- selectTime 格式化成 yyyy-MM-dd HH:mm:ss -->
                <td th:text="${s.selectTime != null ? #temporals.format(s.selectTime, 'yyyy-MM-dd HH:mm:ss') : ''}">
                    2026-05-16 09:51:28
                </td>

                <td>
                    <a class="btn btn-sm btn-info"
                       th:href="@{/student/edit/{id}(id=${s.id})}">编辑</a>
                    <a class="btn btn-sm btn-danger"
                       th:href="@{/student/delete/{id}(id=${s.id})}"
                       onclick="return confirm('确定要删除该记录吗？')">删除</a>
                </td>
            </tr>
            </tbody>
        </table>
    </form>

    <!-- 分页 -->
    <nav th:if="${totalPages != null and totalPages > 1}">
        <ul class="pagination">

            <li class="page-item" th:classappend="${currentPage == 1} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/student/list(page=${currentPage-1},size=${pageSize},
                   studentId=${studentId},studentName=${studentName},sortField=${sortField},sortDir=${sortDir})}">上一页</a>
            </li>

            <li class="page-item"
                th:each="i : ${#numbers.sequence(1, totalPages)}"
                th:classappend="${i == currentPage} ? 'active'">
                <a class="page-link"
                   th:href="@{/student/list(page=${i},size=${pageSize},
                   studentId=${studentId},studentName=${studentName},sortField=${sortField},sortDir=${sortDir})}"
                   th:text="${i}">1</a>
            </li>

            <li class="page-item" th:classappend="${currentPage == totalPages} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/student/list(page=${currentPage+1},size=${pageSize},
                   studentId=${studentId},studentName=${studentName},sortField=${sortField},sortDir=${sortDir})}">下一页</a>
            </li>

        </ul>
    </nav>

</div>
</body>
</html>
