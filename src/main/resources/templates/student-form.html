<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title th:text="${student.id == null ? '新增学生' : '编辑学生'} + ' — 考勤管理系统'">学生表单</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.0/css/bootstrap.min.css}" />
    <link rel="stylesheet" th:href="@{/css/app.css}" />
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="main-content">
    <div class="container">

        <div class="page-header">
            <h2 th:text="${student.id == null ? '➕ 新增学生' : '✏️ 编辑学生'}">学生表单</h2>
            <a class="btn btn-outline-secondary btn-sm" th:href="@{/student/list}">← 返回列表</a>
        </div>

        <div class="form-card">
            <form th:object="${student}"
                  th:action="@{${student.id == null} ? '/student/save' : '/student/update'}"
                  method="post">

                <input type="hidden" th:field="*{id}" />

                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label" for="studentId">学号 <span style="color:var(--danger);">*</span></label>
                        <input class="form-control" id="studentId" th:field="*{studentId}" placeholder="如 2023001" />
                        <div class="text-danger mt-1" style="font-size:.8rem;"
                             th:if="${#fields.hasErrors('studentId')}" th:errors="*{studentId}"></div>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label" for="studentName">姓名 <span style="color:var(--danger);">*</span></label>
                        <input class="form-control" id="studentName" th:field="*{studentName}" placeholder="请输入姓名" />
                        <div class="text-danger mt-1" style="font-size:.8rem;"
                             th:if="${#fields.hasErrors('studentName')}" th:errors="*{studentName}"></div>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label" for="gender">性别</label>
                        <select class="form-select" id="gender" th:field="*{gender}">
                            <option value="">— 请选择 —</option>
                            <option value="M">♂ 男 (M)</option>
                            <option value="F">♀ 女 (F)</option>
                        </select>
                        <div class="text-danger mt-1" style="font-size:.8rem;"
                             th:if="${#fields.hasErrors('gender')}" th:errors="*{gender}"></div>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label" for="courseId">课程 <span style="color:var(--danger);">*</span></label>
                        <select class="form-select" id="courseId" th:field="*{courseId}" required>
                            <option value="">— 请选择课程 —</option>
                            <option th:each="c : ${courses}"
                                    th:value="${c.courseId}"
                                    th:text="${c.courseId + ' · ' + c.courseName}">
                            </option>
                        </select>
                        <div class="text-danger mt-1" style="font-size:.8rem;"
                             th:if="${#fields.hasErrors('courseId')}" th:errors="*{courseId}"></div>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label" for="birthDate">出生日期</label>
                        <input type="date" class="form-control" id="birthDate" th:field="*{birthDate}" />
                    </div>

                    <div class="col-md-6">
                        <label class="form-label" for="phone">联系方式</label>
                        <input class="form-control" id="phone" th:field="*{phone}" placeholder="如 13800138000" />
                        <div class="text-danger mt-1" style="font-size:.8rem;"
                             th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
                    </div>

                    <div class="col-12">
                        <label class="form-label">选课时间</label>
                        <input class="form-control" style="background:#f8fafc; color:var(--muted);"
                               th:value="${student.selectTime != null ? #temporals.format(student.selectTime, 'yyyy-MM-dd HH:mm:ss') : '新增后自动生成'}"
                               readonly />
                    </div>
                </div>

                <div class="d-flex gap-2 mt-4">
                    <button type="submit" class="btn btn-primary">保存</button>
                    <a class="btn btn-outline-secondary" th:href="@{/student/list}">取消</a>
                </div>
            </form>
        </div>

    </div>
</div>

<script th:src="@{/webjars/bootstrap/5.3.0/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
